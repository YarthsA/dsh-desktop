name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        working-directory: app
        # restore 必须与 build/publish 使用同一 RID，否则 assets 文件缺少
        # net10.0-windows/win-x64 目标，后续 --no-restore 构建会报 NETSDK1047
        run: dotnet restore -r win-x64

      - name: Build
        working-directory: app
        run: dotnet build -c Release -r win-x64 --no-restore

      - name: Publish
        working-directory: app
        run: dotnet publish -c Release -r win-x64 --self-contained false --no-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-win-x64
          path: app/bin/Release/net10.0-windows/win-x64/publish
